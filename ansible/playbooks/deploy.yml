---
- name: Deploy da aplicacao em produção
  hosts: servers
  vars:
    project_dir: /home/fga/advocacia-app-back-prod
    registry_image: "{{ registry_image }}"
    image_tag: "{{ image_tag }}"

  tasks:
    - name: Garantir diretorio de produção no servidor
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Copiar docker-compose.yml
      ansible.builtin.copy:
        src: ../../docker-compose.yml
        dest: "{{ project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Substituir build . pela imagem do registry no docker compose.
      ansible.builtin.replace:
        path: "{{ project_dir }}/docker-compose.yml"
        regexp: '^(\s*)build:\s*\.\s*$'
        replace: '\1image: ${REGISTRY_IMAGE}:${IMAGE_TAG:-latest}'

    - name: Autenticar no Container Registry (GHCR)
      ansible.builtin.shell:
        cmd: "echo {{ registry_password | quote }} | docker login {{ registry_url }} -u {{ registry_user | quote }} --password-stdin"
      no_log: true

    - name: Copiar arquivo .env para o servidor
      ansible.builtin.copy:
        src: "{{ env_file_path }}"
        dest: "{{ project_dir }}/.env"
        mode: "0600"

    - name: Pull das imagens
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ project_dir }}"
      environment:
        REGISTRY_IMAGE: "{{ registry_image }}"
        IMAGE_TAG: "{{ image_tag }}"

    - name: Recriar containers
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate --no-deps --remove-orphans
        chdir: "{{ project_dir }}"
      environment:
        REGISTRY_IMAGE: "{{ registry_image }}"
        IMAGE_TAG: "{{ image_tag }}"

    - name: Limpar imagens antigas
      ansible.builtin.command:
        cmd: docker image prune -af

    - name: Excluir pasta do projeto com compose e .env
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: absent
